---
name: "Mailing List Service Build"

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      TEST_PGUSER: testuser
      TEST_PGPASSWORD: test-password
      TEST_PGHOST: 127.0.0.1
      TEST_PGPORT: "5432"
      TEST_PGDATABASE: postgres
    services:
      postgres:
        image: postgres:16-alpine@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod

      - name: Download Dependencies
        run: make deps

      - name: Generate service code
        run: make apigen

      - name: Build
        run: make build

      - name: Prepare test database URL
        # Build the synthetic connection URL at runtime, retaining secret scanning.
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import quote, urlencode, urlunsplit
          authority = "{}:{}@{}:{}".format(
              quote(os.environ["TEST_PGUSER"], safe=""),
              quote(os.environ["TEST_PGPASSWORD"], safe=""),
              os.environ["TEST_PGHOST"], os.environ["TEST_PGPORT"],
          )
          dsn = urlunsplit(("postgresql", authority,
              "/" + quote(os.environ["TEST_PGDATABASE"], safe=""),
              urlencode({"sslmode": "disable"}), ""))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write("MAILING_LIST_STATE_TEST_DATABASE_URL=" + dsn + "\n")
          PY
      - name: Run tests
        run: make test
